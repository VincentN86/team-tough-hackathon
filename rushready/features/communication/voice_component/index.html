<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap');
  body { font-family: "Lexend", "Segoe UI", Arial, sans-serif; margin: 0; padding: 2px; color: #191919; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  #btn { flex: 0 0 46%; min-height: 84px; font: 700 1.2rem "Lexend", "Segoe UI", Arial, sans-serif; border: 0; border-radius: 12px;
         background: #ff3008; color: #fff; cursor: pointer; }
  #btn:hover { background: #d92806; }
  #btn.on { background: #191919; }                                  /* listening: dark, so red stays "start" and never reads as an error */
  #btn:disabled { background: #bdbdbd; cursor: not-allowed; }
  #btn:focus-visible, summary:focus-visible { outline: 3px solid #191919; outline-offset: 3px; }
  #panel { flex: 1; min-width: 0; }
  #status { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; }
  #dot { display:inline-block; width:11px; height:11px; border-radius:50%; background:#9a9a9a; margin-right:8px; flex: none; }
  #status.listening #dot { background: #ff3008; animation: pulse 1.4s infinite; }
  #status.processing #dot { background: #93370d; }
  #live { min-height: 44px; padding: 8px 10px; border: 1px solid #e4e4e4; border-radius: 8px; background: #f6f6f6; font-size: .9rem; }
  #live.hint { color: #5f5f5f; }
  .err { color: #b42318; margin-top: 6px; font-size: .85rem; font-weight: 500; }
  details { margin-top: 6px; font-size: .78rem; color: #5f5f5f; }
  summary { cursor: pointer; display: inline-block; padding: 4px 0; font-weight: 500; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,48,8,.5) } 50% { box-shadow: 0 0 0 7px rgba(255,48,8,0) } }
  @media (prefers-reduced-motion: reduce) { #status.listening #dot { animation: none; } }
</style>
</head>
<body>
<!-- FEATURE 3 microphone. Edit this file to change the button, labels or listening behaviour.
     It talks to Streamlit with postMessage (no build step). Every FINISHED sentence is sent immediately. -->
<div class="row">
  <button id="btn">Start Listening</button>
  <div id="panel">
    <div id="status"><span id="dot"></span><span id="stext">Microphone Off</span></div>
    <div id="live" class="hint">e.g. “The fryer is ten minutes behind”</div>
    <div id="err" class="err" role="alert"></div>
  </div>
</div>
<details>
  <summary>Mic help</summary>
  Listens only while ON and this page is open. Chrome or Edge may send audio to their speech service. Pause any time.
</details>
<script>
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), '*'); }
  send('streamlit:componentReady', { apiVersion: 1 });
  send('streamlit:setFrameHeight', { height: 128 });

  var btn = document.getElementById('btn'), stext = document.getElementById('stext'), statusEl = document.getElementById('status');
  var live = document.getElementById('live'), errEl = document.getElementById('err');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, want = false, utterances = [], seq = 0, procTimer = null;
  var MESSAGES = {
    'not-allowed': 'Microphone permission denied. Allow it in the browser address bar, or type the report below.',
    'service-not-allowed': 'Microphone is blocked for this page. Type the report below.',
    'audio-capture': 'No microphone found. Type the report below.',
    'network': 'Speech recognition needs a network connection. Type the report below.'
  };
  if (!SR) { btn.disabled = true; errEl.textContent = "This browser doesn't support speech recognition (use Chrome or Edge). Type the report below."; }

  // three states: Microphone Off | Listening | Processing (shown briefly after each finished sentence is handed to the app)
  function state(name) {
    statusEl.className = name;
    stext.textContent = name === 'listening' ? 'Listening' : name === 'processing' ? 'Processing' : 'Microphone Off';
  }
  function ui(on) {
    btn.className = on ? 'on' : '';
    btn.textContent = on ? 'Pause Listening' : 'Start Listening';
    state(on ? 'listening' : 'off');
  }
  function emit() { send('streamlit:setComponentValue', { value: { utterances: utterances.slice(-20) }, dataType: 'json' }); }

  function begin() {
    rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    rec.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          t = t.trim();
          if (t) {
            utterances.push({ id: Date.now() + '-' + (seq++), text: t });
            live.className = ''; live.textContent = t; emit();
            state('processing'); clearTimeout(procTimer); procTimer = setTimeout(function () { if (want) state('listening'); }, 1500);
          }
        } else { interim += t; }
      }
      if (interim) { live.className = ''; live.textContent = interim + '…'; }
    };
    rec.onerror = function (e) {
      if (e.error === 'no-speech' || e.error === 'aborted') return;   // normal; we restart below
      errEl.textContent = MESSAGES[e.error] || ('Speech error: ' + e.error + '. Type the report instead.');
      want = false; ui(false);
    };
    // Browsers end a session after a quiet spell. Restart so the chef doesn't have to click again.
    rec.onend = function () { if (want) setTimeout(function () { try { begin(); } catch (x) {} }, 300); else ui(false); };
    try { rec.start(); ui(true); } catch (x) { errEl.textContent = 'Could not start the microphone. Type the report instead.'; want = false; ui(false); }
  }
  btn.onclick = function () {
    if (want) { want = false; try { rec.stop(); } catch (x) {} ui(false); return; }
    errEl.textContent = ''; want = true; begin();
  };
</script>
</body>
</html>
